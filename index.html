<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sahil Monga · Portfolio</title>
  <meta name="description" content="Sahil Monga: business analytics, AI automation and web design projects.">
  <link rel="canonical" href="https://sahilmonga.com/">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <!-- Link previews (LinkedIn, iMessage, Slack, etc.) -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://sahilmonga.com/">
  <meta property="og:title" content="Sahil Monga · Portfolio">
  <meta property="og:description" content="AI automation, business analytics and web design projects by Sahil Monga, a business student at BCIT.">
  <meta property="og:image" content="https://sahilmonga.com/images/sahil.jpg">
  <meta name="twitter:card" content="summary">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Fullscreen background layers are inserted here by script.js -->
  <div class="stage" id="stage" aria-hidden="true">
    <div class="scrim"></div>
  </div>
  <div class="ph-tag" id="phTag" hidden></div>

  <header class="nav">
    <a class="brand" href="#contact" aria-label="Sahil Monga, contact">Sahil Monga</a>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Projects">
      <span class="tab-indicator" id="tabIndicator"></span>
    </nav>
    <button class="cta" id="contactBtn">Contact</button>
  </header>

  <main>
    <section class="card" id="card" aria-live="polite">
      <div class="card-body" id="cardBody"></div>
      <div class="card-foot">
        <div class="progress" id="progress"></div>
        <span class="counter" id="counter"></span>
        <div class="arrows">
          <button class="arrow" id="prev" aria-label="Previous slide">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <button class="arrow arrow-primary" id="next" aria-label="Next slide"></button>
        </div>
      </div>
    </section>

    <section class="card contact" id="contact" hidden>
      <div class="card-body" id="contactBody"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
